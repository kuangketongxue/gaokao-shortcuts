name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一个部署不并发跑：逐文件推 commit 时会触发多次 run，只保留最新那次
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 索引是生成的：改了 tech/*.md 却忘了跑 npm run index，这里会红灯
      - name: 校验索引未漂移
        run: node tools/build-index.mjs --check

      - name: 构建索引与站点数据
        run: node tools/build-index.mjs

      # 渲染管线冒烟测试：占位符泄漏 / 公式解析失败 / 产物缺失，这里红灯
      - name: 渲染与一致性检查
        run: node tools/check-render.mjs

      # pages deploy 不会自动建项目，首次部署必须先建（已存在时 || true 容错）
      - name: 确保 Pages 项目存在
        run: npx --yes wrangler@latest pages project create 27thu || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name=27thu --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
